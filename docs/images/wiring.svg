<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Polysim Grip G1 – how it connects to the base</title>
  <style>
    .group  { fill: none; stroke: #b0bec5; stroke-width: 2; stroke-dasharray: 8 6; }
    .gtitle { font-size: 13px; font-weight: 800; fill: #78909c; letter-spacing: 2px; }
    .box    { fill: #f7f9fc; stroke: #37474f; stroke-width: 2; }
    .pcb    { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2.5; }
    .enc    { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; }
    .pc     { fill: #f3e5f5; stroke: #6a1b9a; stroke-width: 2; }
    .prog   { fill: #fffde7; stroke: #f9a825; stroke-width: 2; stroke-dasharray: 6 4; }
    .title  { font-size: 15px; font-weight: 700; fill: #263238; }
    .sub    { font-size: 12px; fill: #607d8b; }
    .chip   { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .conn   { font-size: 11px; font-weight: 700; fill: #263238; }
    .lbl    { font-size: 12px; font-weight: 600; fill: #455a64; }
    .w      { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .v5 { stroke: #d32f2f; } .gnd { stroke: #424242; } .sda { stroke: #1e88e5; } .scl { stroke: #43a047; }
    .sig    { fill: none; stroke: #8e24aa; stroke-width: 3; stroke-linecap: round; }
    .encw   { fill: none; stroke: #1565c0; stroke-width: 3; stroke-linecap: round; }
  </style>

  <rect x="1" y="1" width="998" height="538" rx="14" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>

  <!-- ===================== GRIP ===================== -->
  <rect class="group" x="20" y="20" width="350" height="450" rx="14"/>
  <text x="40" y="44" class="gtitle">GRIP</text>

  <!-- thumb stick -->
  <rect class="box" x="40" y="70" width="130" height="90" rx="10"/>
  <text x="105" y="98" class="title" text-anchor="middle">Thumb stick</text>
  <circle cx="105" cy="128" r="18" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <circle cx="105" cy="128" r="7" fill="#b0bec5"/>
  <!-- side button -->
  <rect class="box" x="40" y="190" width="130" height="80" rx="10"/>
  <text x="105" y="218" class="title" text-anchor="middle">Side button</text>
  <circle cx="105" cy="243" r="13" fill="#ffffff" stroke="#8e24aa" stroke-width="2.5"/>
  <circle cx="105" cy="243" r="6" fill="#ce93d8"/>

  <!-- grip PCB -->
  <rect class="pcb" x="210" y="70" width="140" height="270" rx="12"/>
  <text x="280" y="96" class="title" text-anchor="middle">Grip PCB V2</text>
  <rect x="228" y="112" width="104" height="62" rx="5" fill="#263238"/>
  <text x="280" y="138" class="chip" text-anchor="middle">ATmega328P</text>
  <text x="280" y="156" font-size="11" fill="#b0bec5" text-anchor="middle">I2C slave 0x55</text>
  <rect x="228" y="292" width="104" height="30" rx="6" fill="#ffffff" stroke="#f9a825" stroke-width="2"/>
  <text x="280" y="312" class="conn" text-anchor="middle" style="fill:#f57f17">ICSP · J1</text>

  <!-- inputs -->
  <path class="sig" d="M170 115 H228"/>
  <text x="199" y="108" class="lbl" text-anchor="middle">X Y SW</text>
  <path class="sig" d="M170 230 H200 V160 H228"/>
  <text x="185" y="223" class="lbl" text-anchor="middle">SIG</text>

  <!-- ISP programmer -->
  <path d="M280 322 V390" fill="none" stroke="#f9a825" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect class="prog" x="190" y="390" width="160" height="62" rx="10"/>
  <text x="270" y="414" class="title" text-anchor="middle" style="font-size:13px">ISP programmer</text>
  <text x="270" y="432" class="sub" text-anchor="middle">USBasp / Arduino as ISP</text>
  <text x="270" y="446" class="sub" text-anchor="middle">firmware upload only</text>

  <!-- ===================== 4-wire grip cable ===================== -->
  <path class="w v5"  d="M350 214 H470"/>
  <path class="w gnd" d="M350 222 H470"/>
  <path class="w sda" d="M350 230 H470"/>
  <path class="w scl" d="M350 238 H470"/>
  <text x="410" y="190" class="lbl" text-anchor="middle">4-wire</text>
  <text x="410" y="204" class="lbl" text-anchor="middle">cable</text>
  <text x="410" y="258" class="sub" text-anchor="middle">bottom</text>
  <text x="410" y="272" class="sub" text-anchor="middle">connector</text>

  <!-- ===================== BASE ===================== -->
  <rect class="group" x="450" y="20" width="530" height="450" rx="14"/>
  <text x="470" y="44" class="gtitle">BASE</text>

  <!-- X encoder -->
  <rect class="enc" x="490" y="70" width="160" height="70" rx="10"/>
  <text x="570" y="100" class="title" text-anchor="middle">X encoder PCB</text>
  <text x="570" y="118" class="sub" text-anchor="middle">magnetic sensor</text>

  <!-- Y encoder with GRIP_IN -->
  <rect class="enc" x="490" y="180" width="160" height="110" rx="10"/>
  <rect x="470" y="206" width="56" height="40" rx="5" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <text x="498" y="223" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">GRIP</text>
  <text x="498" y="236" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">_IN</text>
  <text x="590" y="214" class="title" text-anchor="middle">Y encoder</text>
  <text x="590" y="232" class="title" text-anchor="middle">PCB</text>
  <text x="590" y="250" class="sub" text-anchor="middle">magnetic sensor</text>
  <text x="590" y="266" class="sub" text-anchor="middle">+ grip input</text>

  <!-- base PCB -->
  <rect class="pcb" x="760" y="70" width="200" height="270" rx="12"/>
  <text x="860" y="96" class="title" text-anchor="middle">Base PCB V2</text>
  <rect x="808" y="160" width="130" height="62" rx="5" fill="#263238"/>
  <text x="873" y="186" class="chip" text-anchor="middle">ATmega32U4</text>
  <text x="873" y="204" font-size="11" fill="#b0bec5" text-anchor="middle">I2C master · USB</text>
  <!-- connectors on left edge -->
  <rect x="742" y="96" width="52" height="24" rx="4" fill="#ffffff" stroke="#37474f" stroke-width="1.5"/>
  <text x="768" y="112" class="conn" text-anchor="middle">ENC_1</text>
  <rect x="742" y="214" width="52" height="24" rx="4" fill="#ffffff" stroke="#37474f" stroke-width="1.5"/>
  <text x="768" y="230" class="conn" text-anchor="middle">GRIP</text>
  <rect x="742" y="262" width="52" height="24" rx="4" fill="#ffffff" stroke="#37474f" stroke-width="1.5"/>
  <text x="768" y="278" class="conn" text-anchor="middle">ENC_2</text>

  <!-- X encoder -> ENC_1 -->
  <path class="encw" d="M650 108 H742"/>
  <text x="696" y="100" class="lbl" text-anchor="middle">X angle</text>
  <!-- Y encoder: grip pass-through -> GRIP -->
  <path class="w v5"  d="M650 214 H742"/>
  <path class="w gnd" d="M650 222 H742"/>
  <path class="w sda" d="M650 230 H742"/>
  <path class="w scl" d="M650 238 H742"/>
  <text x="696" y="204" class="lbl" text-anchor="middle">grip</text>
  <!-- Y encoder -> ENC_2 -->
  <path class="encw" d="M650 274 H742"/>
  <text x="696" y="294" class="lbl" text-anchor="middle">Y angle</text>

  <!-- USB to PC -->
  <path d="M860 340 V400" fill="none" stroke="#6a1b9a" stroke-width="3" stroke-linecap="round"/>
  <text x="872" y="375" class="lbl">USB</text>
  <rect class="pc" x="790" y="400" width="140" height="50" rx="10"/>
  <text x="860" y="423" class="title" text-anchor="middle">PC</text>
  <text x="860" y="440" class="sub" text-anchor="middle">game controller</text>

  <!-- legend -->
  <g font-size="12" fill="#455a64">
    <line x1="30" y1="505" x2="52" y2="505" stroke="#d32f2f" stroke-width="3"/><text x="58" y="509">VCC</text>
    <line x1="100" y1="505" x2="122" y2="505" stroke="#424242" stroke-width="3"/><text x="128" y="509">GND</text>
    <line x1="172" y1="505" x2="194" y2="505" stroke="#1e88e5" stroke-width="3"/><text x="200" y="509">SDA</text>
    <line x1="242" y1="505" x2="264" y2="505" stroke="#43a047" stroke-width="3"/><text x="270" y="509">SCL</text>
    <text x="330" y="509">· The base polls the grip over I2C (address 0x55) and sends everything to the PC over USB.</text>
  </g>
</svg>
